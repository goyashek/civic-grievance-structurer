name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-mlops.txt
      - run: python -c "import src.backfill_mlflow, src.check_reproducibility, src.report_final"
      - run: python -m unittest discover -s tests -v
      - run: python src/check_examples.py
      - run: python src/check_annotations.py
      - run: python src/check_bakeoff.py
      - run: python src/check_canonical_cases.py
      - run: python src/check_surface_variants.py
      - run: python src/check_public_data.py
      - run: python src/check_test_cases.py
      - run: python src/check_dataset_freeze.py
      - run: python -m src.report_validation
      - run: python -m src.report_final
      - run: dvc repro
      - run: dvc status
