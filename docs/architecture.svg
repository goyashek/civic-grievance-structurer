<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">CivicStruct architecture</title>
  <desc id="desc">Versioned data flows through notebook experiments, MLflow, Evaluation v2, model registry gates, and shared inference. The shared inference serves the CLI, FastAPI, and Gradio demo, while FastAPI runs in a GPU container.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .title { fill: #0f172a; font: 700 18px -apple-system, BlinkMacSystemFont, sans-serif; text-anchor: middle; }
      .detail { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="400" y="30" width="300" height="78"/>
  <text class="title" x="550" y="62">Versioned data</text>
  <text class="detail" x="550" y="87">DVC and frozen manifests</text>

  <rect class="box" x="400" y="150" width="300" height="78"/>
  <text class="title" x="550" y="182">Notebook experiments</text>
  <text class="detail" x="550" y="207">Kaggle GPU runs</text>

  <rect class="box" x="400" y="270" width="300" height="78"/>
  <text class="title" x="550" y="302">MLflow tracking</text>
  <text class="detail" x="550" y="327">runs, metadata, and artifacts</text>

  <rect class="box" x="400" y="390" width="300" height="78"/>
  <text class="title" x="550" y="422">Evaluation v2</text>
  <text class="detail" x="550" y="447">src/report_final.py</text>

  <rect class="box" x="400" y="510" width="300" height="78"/>
  <text class="title" x="550" y="542">Quality gates and registry</text>
  <text class="detail" x="550" y="567">src/model_registry.py</text>

  <rect class="box" x="400" y="630" width="300" height="78"/>
  <text class="title" x="550" y="662">Shared frozen inference</text>
  <text class="detail" x="550" y="687">src/inference.py</text>

  <path class="arrow" d="M550 108 V150"/>
  <path class="arrow" d="M550 228 V270"/>
  <path class="arrow" d="M550 348 V390"/>
  <path class="arrow" d="M550 468 V510"/>
  <path class="arrow" d="M550 588 V630"/>

  <rect class="box" x="40" y="630" width="220" height="78"/>
  <text class="title" x="150" y="662">CLI</text>
  <text class="detail" x="150" y="687">src/cli.py</text>

  <rect class="box" x="820" y="510" width="220" height="78"/>
  <text class="title" x="930" y="542">FastAPI</text>
  <text class="detail" x="930" y="567">src/api.py</text>

  <rect class="box" x="820" y="630" width="220" height="78"/>
  <text class="title" x="930" y="662">Gradio review demo</text>
  <text class="detail" x="930" y="687">src/demo.py</text>

  <rect class="box" x="820" y="390" width="220" height="78"/>
  <text class="title" x="930" y="422">GPU container</text>
  <text class="detail" x="930" y="447">Dockerfile</text>

  <path class="arrow" d="M400 669 H260"/>
  <path class="arrow" d="M700 669 H820"/>
  <path class="arrow" d="M700 669 C770 669 770 549 820 549"/>
  <path class="arrow" d="M930 510 V468"/>
</svg>
